# Quick smoke test — no .env file required
#
#   docker compose -f docker-compose.quick.yml up -d --build
#   curl http://127.0.0.1:8000/health
#   Web Preview → port 8000
#
# UI loads; POST /analyze needs API keys in .env for real AI calls.

services:
  db:
    image: postgres:16-alpine
    container_name: foodanalyzer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: foodanalyzer
    volumes:
      - foodanalyzer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodanalyzer"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - foodanalyzer-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: food-analyzer:latest
    container_name: foodanalyzer-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: foodanalyzer
      DATABASE_URL: postgresql+asyncpg://postgres:dev@db:5432/foodanalyzer
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: INFO
    volumes:
      - foodanalyzer_uploads:/app/uploads
    networks:
      - foodanalyzer-net

networks:
  foodanalyzer-net:
    driver: bridge

volumes:
  foodanalyzer_pgdata:
  foodanalyzer_uploads:
